<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry genius calculate</title>


    <!-- Daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="m-8">

    <header>

    </header>


    <main class="">
        <!-- main container -->
        <div class="flex lg:flex-row md:flex-col flex-col  space-x-5">

            <!-- shape card container -->
            <div class="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Triangle -->
                <div class="card bg-base-100 p-2  shadow-sm">
                    <figure>
                        <img class="w-full" src="images/triangle.png" />
                    </figure>

                    <div class="card-body">
                        <div class="font-semibold text-center">
                            <h2 class=" text-xl ">Triangle</h2>
                            <p>Area: 0.5 X b X h</p>
                        </div>


                        <div class="text-center my-5">
                            <input id="triangleBase" class="w-16 text-xl p-2  rounded-md" type="text" placeholder="b">
                            <span>cm</span>
                            <input id="triangleHeight" class="w-16 text-xl p-2  rounded-md" type="text" placeholder="h">
                            <span>cm</span>
                        </div>
                        <div>
                            Area: <span id="triangleAreaResult">0</span> <span>cm<sup>2</sup></span>
                        </div>
                        <button onclick="triangleCalculate()" class="btn btn-primary w-full">Calculate</button>

                    </div>
                </div>
                <!-- Rectangle -->
                <div class="card bg-base-100 p-2  shadow-sm">
                    <figure>
                        <img class="w-full" src="images/rectangle.png" />
                    </figure>

                    <div class="card-body">
                        <div class="font-semibold text-center">
                            <h2 class=" text-xl ">Rectangle</h2>
                            <p>Area: l X w </p>
                        </div>

                        <div>
                            Area: <span id="rectangleAreaResult">0</span> <span>cm<sup>2</sup></span>
                        </div>
                        <div class="text-center my-5">
                            <input id="rectangleBase" class="w-16 text-xl p-2  rounded-md" type="text" placeholder="l">
                            <span>cm</span>
                            <input id="rectangleHeight" class="w-16 text-xl p-2  rounded-md" type="text" name=""
                                placeholder="w">
                            <span>cm</span>
                        </div>

                        <button onclick="rectangleCalculate()" class="btn btn-primary w-full">Calculate</button>

                    </div>
                </div>
                <!-- Parallelogram -->
                <div class="card bg-base-100 p-2  shadow-sm">
                    <figure>
                        <img class="w-full" src="images/parallelogram.png" />
                    </figure>

                    <div class="card-body">
                        <div class="font-semibold text-center">
                            <h2 class=" text-xl ">Parallelogram</h2>
                            <p>Area: 0.5 X b X h</p>
                        </div>


                        <div class="text-center my-5">
                            <input class="w-16 text-xl p-2  rounded-md" type="text" placeholder="b">
                            <span>cm</span>
                            <input class="w-16 text-xl p-2  rounded-md" type="text" name="" id="" placeholder="h">
                            <span>cm</span>
                        </div>

                        <button class="btn btn-primary w-full">Calculate</button>

                    </div>
                </div>
                <!-- Rhombus -->
                <div class="card bg-base-100 p-2  shadow-sm">
                    <figure>
                        <img class="w-full" src="images/rhombus.png" />
                    </figure>

                    <div class="card-body">
                        <div class="font-semibold text-center">
                            <h2 class=" text-xl ">Rhombus</h2>
                            <p>Area: 0.5 X b X h</p>
                        </div>


                        <div class="text-center my-5">
                            <input class="w-16 text-xl p-2  rounded-md" type="text" placeholder="b">
                            <span>cm</span>
                            <input class="w-16 text-xl p-2  rounded-md" type="text" name="" id="" placeholder="h">
                            <span>cm</span>
                        </div>

                        <button class="btn btn-primary w-full">Calculate</button>

                    </div>
                </div>
                <!-- Pentagon -->
                <div class="card bg-base-100 p-2  shadow-sm">
                    <figure class="">
                        <img class="w-full" src="images/pentagon.png" />
                    </figure>

                    <div class="card-body">
                        <div class="font-semibold text-center">
                            <h2 class=" text-xl ">Pentagon</h2>
                            <p>Area: 0.5 X b X h</p>
                        </div>


                        <div class="text-center my-5">
                            <input class="w-16 text-xl p-2  rounded-md" type="text" placeholder="b">
                            <span>cm</span>
                            <input class="w-16 text-xl p-2  rounded-md" type="text" name="" id="" placeholder="h">
                            <span>cm</span>
                        </div>

                        <button class="btn btn-primary w-full">Calculate</button>

                    </div>
                </div>
                <!-- Ellipse -->
                <div class="card bg-base-100 p-2  shadow-sm">
                    <figure>
                        <img class="w-full" src="images/ellipse.png" />
                    </figure>

                    <div class="card-body">
                        <div class="font-semibold text-center">
                            <h2 class=" text-xl ">Ellipse</h2>
                            <p>Area: 0.5 X b X h</p>
                        </div>


                        <div class="text-center my-5">
                            <input class="w-16 text-xl p-2  rounded-md" type="text" placeholder="b">
                            <span>cm</span>
                            <input class="w-16 text-xl p-2  rounded-md" type="text" name="" id="" placeholder="h">
                            <span>cm</span>
                        </div>

                        <button class="btn btn-primary w-full">Calculate</button>

                    </div>
                </div>




            </div>


            <!-- area container -->
            <div class=" border border-gray-100 rounded-md px-3 ">
                <h3 class="text-3xl text-center">Area calculation</h3>
            </div>


        </div>



    </main>



    <footer>

    </footer>
    <script src="JS/calculate.js"></script>
</body>

</html>
